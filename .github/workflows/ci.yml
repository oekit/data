name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    uses: oekit/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.24'
      # all/ 聚合嵌套模块（其依赖 redisx/timertask 要求 go >= 1.26，
      # GOTOOLCHAIN 默认 auto 会自动切换工具链）
      additional-script: |-
        cd all && go build ./... && go test -race -count=1 ./...

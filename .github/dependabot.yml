version: 2
updates:
  # 全量分组：每周外部+内部依赖合并为一个 PR，
  # 组合兼容性由该 PR 的 CI 一次验证，避免逐包 PR 洪峰（34+ PR 那种）。
  # 嵌套多模块仓：根模块 + 嵌套聚合模块各一个 directory 条目。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
  # all/ 聚合模块：四兄弟子仓发新版后由 dependabot 自动 PR 更新 pin，
  # 版本同步零人工（组合兼容性由该 PR 的 CI 验证）。
  - package-ecosystem: gomod
    directory: /all
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - "*"
